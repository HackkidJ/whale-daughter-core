# macOS（Docker Desktop）覆盖层。
#
# 原因：Docker Desktop 不支持 `network_mode: host` —— 容器和宿主机不共享 loopback，
# 所以 base compose 里 NapCat 的 host 网络在 macOS 上等于不可达。
# 这里改成 bridge + 端口映射；反向 WS 地址用 ws://bot:8000/onebot/v11/ws（bot 也在 compose 里）：
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.macos.yml \
#     --profile qq up -d
#
# 若 bot 跑在宿主机（uv run uvicorn），NapCat 侧反向 WS 要写 ws://host.docker.internal:8000/...
services:
  napcat:
    network_mode: bridge
    ports:
      - "6099:6099"   # WebUI
      - "3000:3000"   # 预留
      - "3001:3001"   # 预留
    extra_hosts:
      - "host.docker.internal:host-gateway"
