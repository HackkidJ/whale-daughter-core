[project]
name = "dsdaughter"
version = "0.1.0"
description = "赛博女儿 DeepSeek —— 有人格、能上网、可容器化部署的 AI 女儿"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "asyncpg>=0.32.0",
    "mcp>=2.3.0",
    "markdown-it-py>=4.3.0",
    "pilk>=0.2.4",
    "uiautomator2>=3.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[project.scripts]
dsd = "dsdaughter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsdaughter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dsdaughter"]

[tool.ruff.lint.per-file-ignores]
# 内置调试页是一整块 HTML/CSS/JS 字符串，长行不影响可读性
"src/dsdaughter/api.py" = ["E501"]
